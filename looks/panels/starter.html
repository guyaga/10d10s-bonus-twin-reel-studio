    <style>
      /* PANELS starter. Read look/LOOK.md first. Everything marked REPLACE is demo content: swap it for your story.
         Colours: only #111111 / #F5F3EE / #E63B2E, rgba(17,17,17,a) / rgba(245,243,238,a) and color-mix of var(--red). build.py swaps them per creator. */
      *{margin:0;padding:0;box-sizing:border-box;}
      :root{ --ink:#111111; --paper:#F5F3EE; --red:#E63B2E; }
      html,body{ width:1080px; height:1920px; overflow:hidden; background:#111111; }
      #root{ position:relative; width:1080px; height:1920px; overflow:hidden; background:#111111; }
      #cam{ position:absolute; inset:-40px; transform-origin:50% 45%; }
      #cam > *{ position:absolute; }
      .full{ left:40px; top:40px; width:1080px; height:1920px; }
      #flash{ background:#F5F3EE; opacity:0; }
      #grain{ background:url(assets/grain.png); mix-blend-mode:overlay; opacity:.16; pointer-events:none; }
{{LOOKCSS}}
      #fx, #fxu{ left:0; top:0; width:1080px; height:1920px; }
      #fx > *, #fxu > *{ position:absolute; }

      /* ---- frame 0 (the thumbnail): the cover is visible from CSS, never from a t=0 set.
         These three lines must equal stageTwin(0, Q1, F1, TAB1) below: clipB(Q1), clipT(Q1, TAB1), F1 as translate + scale. */
      #tpan{ clip-path:polygon(40px 1130px, 540px 1095px, 540px 1095px, 540px 1095px, 540px 1095px, 1040px 1060px, 1040px 1880px, 40px 1880px); }
      #twc{ clip-path:polygon(40px 1130px, 420px 1103.4px, 420px 600px, 960px 600px, 960px 1065.6px, 1040px 1060px, 1040px 1880px, 40px 1880px); }
      #twin{ transform:translate(-375.2px, 746.4px) scale(1.12); }
      .pg:not(#pg1){ opacity:0; }

      /* ---- cover */
      #c1rays{ left:0; top:0; width:1080px; height:1240px; object-position:50% 30%; transform-origin:50% 40%; }
      #c1art{ left:0; top:0; width:1080px; height:1240px; overflow:hidden; clip-path:polygon(0 0, 1080px 0, 1080px 1036px, 0 1111px); }   /* ends a gutter above his panel (Q1 top edge - 22px) */
      #c1shade{ left:0; top:0; width:1080px; height:620px; background:linear-gradient(180deg, rgba(17,17,17,.75), rgba(17,17,17,0)); }
      #c1mast{ left:40px; top:104px; width:780px; text-align:center; font-size:158px; transform:rotate(-3deg); }

      #c1corner i{ display:block; font:400 46px/1 "Bangers",sans-serif; font-style:normal; color:#E63B2E; letter-spacing:.05em; }
      #c1corner span{ display:block; font:400 32px/1.25 "Secular One",sans-serif; color:#F5F3EE; direction:rtl; }
      #c1title{ left:30px; top:356px; width:1020px; text-align:center; font-size:124px; line-height:1.05; transform:rotate(-3deg); transform-origin:50% 60%; }
      #c1title em{ font-style:normal; color:#E63B2E; }
      /* the "starring" circle: put the story's villain/hero image in it (<img src="assets/hero.png">); the "?" is the no-image fallback */
      #c1vil{ left:46px; top:540px; width:300px; height:300px; border-radius:50%; overflow:hidden; border:12px solid #111111; background:#F5F3EE; box-shadow:10px 10px 0 #E63B2E; }
      #c1vil img{ position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; }
      #c1vil .ono{ left:0; top:14px; width:296px; text-align:center; font-size:250px; }
      #c1lab{ left:30px; top:810px; transform:rotate(-4deg); font-size:40px; }
      #c1burst{ left:742px; top:520px; width:320px; height:290px; transform:rotate(7deg); }
      #c1burst .jag{ font-size:46px; }

      /* ---- art: every panel is a real inked image; a placeholder never shows */
      .art{ position:absolute; object-fit:cover; display:block; }
      .dim{ filter:brightness(.28) contrast(1.2); }                       /* an unrevealed panel: the art, sunk in ink */
      .sfx{ filter:drop-shadow(5px 0 0 #111111) drop-shadow(-5px 0 0 #111111) drop-shadow(0 5px 0 #111111) drop-shadow(0 -5px 0 #111111) drop-shadow(10px 12px 0 #111111); }
      .sfx img{ display:block; width:100%; }
      #tpan .art{ left:0; top:560px; width:1080px; height:1360px; }
      #tbS::after{ content:""; position:absolute; inset:0; background:radial-gradient(ellipse 60% 55% at 50% 72%, rgba(245,243,238,.0), rgba(17,17,17,.45)); }
      #tpan[data-bg="tbS"] #tbS, #tpan[data-bg="tbA"] #tbA{ opacity:1; }
      .cell{ overflow:hidden; border:8px solid #111111; }
      .stone .face{ border:none; border-radius:0; background:none; inset:12% 18% 30% 16%; }   /* the lettering sits on the tombstone art's blank face */
      .stone .face b{ font-size:70px; } .stone .face span{ font-size:44px; }
      .cell img{ position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; }

      /* ---- demo pages (REPLACE with your own page styles) */
      .slot b{ width:180px; text-align:center; font:400 44px/1 "Bangers",sans-serif; letter-spacing:.08em; color:#F5F3EE; background:#111111; border:5px solid #F5F3EE; padding:8px 0 4px; transform:rotate(-3deg); }
      .slot::after{ content:""; position:absolute; inset:0; border:6px dashed rgba(245,243,238,.5); }
      .glyph{ display:flex; align-items:center; justify-content:center; font-size:260px; }   /* a big placeholder glyph where panel art would go */
      #moon{ left:90px; top:150px; width:250px; height:250px; border-radius:50%; }
      #ground{ left:-160px; top:742px; width:1400px; height:700px; border-radius:50%; border:8px solid #111111; }
      .stone{ transform-origin:50% 100%; }
      .stone .half{ position:absolute; }
      .dust{ width:300px; height:90px; border-radius:50%; background:#F5F3EE; border:6px solid #111111; opacity:0; }
      #g1{ left:30px; top:180px; width:320px; text-align:center; font-size:820px; line-height:.86; transform-origin:50% 60%; }
      #slash{ left:250px; top:610px; width:900px; height:22px; background:#F5F3EE; border-top:5px solid #111111; border-bottom:5px solid #111111; transform-origin:100% 50%; }
      #cnt{ font-size:60px; }
      #cnt .lat{ font-size:96px; color:#F5F3EE; -webkit-text-stroke:3px #111111; paint-order:stroke fill; }
{{CAPSTYLE}}
    </style>

            <div class="pp" style="clip-path:polygon(40px 110px,377px 110px,350px 800px,40px 800px);"><img class="art dim" src="assets/art/gag3.jpg" style="left:40px;top:110px;width:337px;height:690px;"></div>
            <div class="pp bd-red hid" id="p2a" style="clip-path:polygon(731px 110px,1040px 110px,1040px 800px,704px 800px);transform-origin:872px 455px;">

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrances never pre-render their from-state (never patch tl.fromTo/tl.from: the renderer hangs)
      const ft = (s, f, t, p) => {
        const to = { immediateRender: false, ...t };
        if (f.opacity !== undefined && to.opacity === undefined && !to.keyframes) to.opacity = f.opacity;
        return tl.fromTo(s, f, to, p);
      };
      const DUR = {{DUR}};
      let seed = 59; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const HANDS = {{HANDS}};
{{LOOKJS}}

      // ===== panels (quads TL,TR,BR,BL) and framings. Slant each top edge 20-70px; keep s >= 0.95.
      const Q1 = [[40, 1130], [1040, 1060], [1040, 1880], [40, 1880]], TAB1 = [420, 960, 600];   // cover: his head breaks out over the cover art
      const Q2 = [[40, 830], [1040, 822], [1040, 1880], [40, 1880]];
      const Q3 = [[40, 980], [1040, 962], [1040, 1880], [40, 1880]];
      const Q4 = [[40, 652], [1040, 622], [1040, 1880], [40, 1880]];
      const Q5 = [[40, 960], [1040, 920], [1040, 1880], [40, 1880]], TAB5 = [420, 960, 700];
      // head tabs: his head always breaks out over the panel above, so a lean or a punch-in never crops his hair
      const TAB2 = [420, 960, 640], TAB3 = [420, 960, 760], TAB4 = [420, 960, 560], TAB6 = [420, 960, 700];
      const Q6 = [[40, 905], [1040, 928], [1040, 1880], [40, 1880]];
      const F1 = F(1.12, 700, 1900), F2 = F(1.0, 790, 1910), F3 = F(0.95, 780, 1900), F4 = F(1.05, 720, 1910);
      const F5 = F(1.0, 770, 1910), F5c = F(1.3, 690, 2140), F6 = F(1.0, 770, 1910);

      // ===== beat times. REPLACE with your beats (audio/timing.json "starts"): one page per beat.
      // The demo plays in the first ~10 s; PAGE 6 then holds until the outro, so any DUR from 15 s up works.
      const B2 = 2.0, B3 = 4.2, B4 = 6.6, B5 = 7.6, B6 = 9.6;   // REPLACE
      const OUT = Math.max(DUR - 1.6, B6 + 1);                   // "to be continued" lands 1.6 s before the end

      // explicit t=0 state: the renderer seeks out of order, so nothing may rely on "not reached yet"
      tl.set(".hid", { opacity: 0 }, 0);
      tl.set(".pg:not(#pg1)", { opacity: 0, x: 0, scale: 1 }, 0);
      tl.set(".half", { x: 0, y: 0, rotation: 0 }, 0);
      tl.set(".crk", { opacity: 1 }, 0);
      tl.set(".crk", { clipPath: "inset(0% 0% 100% 0%)" }, 0);
      tl.set("#slash", { scaleX: 0, rotation: -24 }, 0);
      tl.set("#whip", { opacity: 0 }, 0);
      tl.set("#cntN", { textContent: "0" }, 0);

      // ---------- ambient (runs to DUR)
      tl.to("#cam", { x: 5, y: -4, rotation: 0.25, duration: 1.6, ease: "sine.inOut", repeat: Math.floor(DUR / 1.6), yoyo: true }, 0);
      for (let k = 0; k < DUR; k += 0.1) tl.set("#grain", { backgroundPosition: `${Math.round(rnd() * 512)}px ${Math.round(rnd() * 512)}px` }, k);

      // ===== PAGE 1 · COVER  0 – B2   helpers: stageTwin, panelBg, bubAt, drift, twos, shake
      stageTwin(0, Q1, F1, TAB1);
      panelBg(0, "#tbS");
      bubAt(0, 40, 1050, 520);   // the bubble's right edge stays ~20px left of his face
      drift(0.05, F(1.15, 700, 1900), B2 - 0.1);
      twos("#c1burst", 0.1, B2, 7, 1.4);
      shake(0.12, 8);
      ft("#c1title", { scale: 1 }, { keyframes: [{ scale: 1.08, duration: 0.14, ease: "back.out(3)" }, { scale: 1.05, duration: 0.4, ease: "sine.inOut" }] }, 1.3);   // REPLACE t: the title inflates on its key word (boing)
      ft("#c1rays", { scale: 1 }, { scale: 1.08, duration: B2, ease: "none" }, 0);

      // ===== PAGE 2 · THREE-PANEL GAG  B2 – B3   helpers: turnPage (cover -> page 1 only), moveTwin, slam, spP (from his hand), ono

      panelBg(B5 - 0.1, "#tbS");

      ono("#oSlash", B5 + 0.72, B5 + 1.2, -12); shake(B5 + 0.72, 18); flash(B5 + 0.72);

      moveTwin(B5 + 1.3, Q5, F5c, TAB5, 0.14, "power3.out");

      ono("#oQ", B5 + 1.34, B6 - 0.1, 6);

      slam("#tbc", OUT, null, -2);

      // ---------- captions: speech bubbles (one bubble per chunk, tail to his mouth; move the zone with bubAt)
      const KEY = new Set([]);     // REPLACE: key words, red + bigger
      const SKIP = new Set([]);    // a chunk starting with one of these gets no bubble (the cover title already says it)
      const BURST = new Set([]);   // a chunk starting with one of these becomes a jagged red burst (quotes, screams)
      const caps = {{CAPS}};
      const box = document.getElementById("caps");
      caps.forEach((chunk, i) => {
        const d = document.createElement("div"); d.className = "cap" + (BURST.has(chunk[0][0]) ? " burst" : ""); d.id = "cap" + i;
        const bb = document.createElement("div"); bb.className = "bb"; d.appendChild(bb);
        chunk.forEach(([w], j) => { const s = document.createElement("span"); s.className = "w" + (/^[\x00-\x7F×]+$/.test(w) ? " lat" : "") + (KEY.has(w) ? " key" : ""); s.id = `cw${i}_${j}`; s.textContent = w; bb.appendChild(s); });
        box.appendChild(d);
        tl.set(d, { opacity: 0 }, 0);
        if (SKIP.has(chunk[0][0])) return;
        const start = chunk[0][1], end = i + 1 < caps.length ? Math.min(caps[i + 1][0][1], chunk[chunk.length - 1][1] + 1.2) : DUR;
        ft(d, { opacity: 1, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2.6)" }, start - 0.04);   // pops in solid, never see-through
        chunk.forEach(([w, s], j) => { const nx = j + 1 < chunk.length ? chunk[j + 1][1] : end; tl.set(`#cw${i}_${j}`, { attr: { "data-on": "1" } }, s); tl.set(`#cw${i}_${j}`, { attr: { "data-on": "0" } }, nx); });
        if (i + 1 < caps.length) tl.set(d, { opacity: 0 }, end - 0.06);   // gone before the next bubble pops (it starts at -0.04)
      });
      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
